name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@stable

      - name: نصب پکیج‌های Node
        run: npm install

      - name: نصب Tauri CLI
        run: npm install -D @tauri-apps/cli @tauri-apps/api

      - name: ساخت فایل اجرایی ویندوز
        run: npx tauri build

      - name: آپلود خروجی (نصب‌کننده NSIS و MSI)
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
